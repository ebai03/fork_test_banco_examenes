name: Sync to Production

on:
  push:
    branches: [master]

jobs:
  sync:
    name: Pull course files
    runs-on: self-hosted
    environment: prod

    env:
      DATA_DIR: /home/ebai/cursoteca/data

    steps:
      - name: Pull latest course files
        run: git -C "$DATA_DIR" pull --ff-only origin master

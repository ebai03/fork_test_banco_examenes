name: Sync to Production

on:
  push:
    branches: [master]

jobs:
  sync:
    name: Pull course files
    runs-on: self-hosted
    environment: prod

    env:
      DATA_DIR: /home/ebai/cursoteca/data

    steps:
      - name: Sync latest course files
        run: |
          git -C "$DATA_DIR" fetch origin master
          git -C "$DATA_DIR" diff --stat HEAD origin/master || true
          git -C "$DATA_DIR" reset --hard origin/master
